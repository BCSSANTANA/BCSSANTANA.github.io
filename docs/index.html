<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bruno Santana</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #040d1e;
      --star:   #a8c0e8;
      --white:  #e8f0ff;
      --yellow: #f5c842;
      --dim:    rgba(232, 240, 255, 0.45);
      --frame-border: rgba(168, 192, 232, 0.5);
      --frame-glow:   rgba(100, 160, 255, 0.22);

      /* Layout targets */
      --frame-full: 260px;
      --frame-icon: 46px;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      cursor: default;
      color: var(--white);
    }

    /* ════════════════════════════════
       PHOTO FRAME
    ════════════════════════════════ */
    #frame {
      position: fixed;
      /* start: centered */
      top: 50%;
      left: 50%;
      width: var(--frame-full);
      height: var(--frame-full);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--frame-border);
      box-shadow: 0 0 0 8px rgba(168,192,232,0.07),
                  0 0 50px 10px var(--frame-glow);
      overflow: hidden;
      background: rgba(168,192,232,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      /* We drive ALL movement via JS-set CSS custom properties + transitions */
      transition: none; /* JS handles timing */
    }

    #frame .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0.4;
      user-select: none;
      pointer-events: none;
    }

    #frame .placeholder svg {
      width: 64px; height: 64px;
      stroke: var(--star); fill: none; stroke-width: 1.2;
      transition: width .6s ease, height .6s ease;
    }

    #frame .placeholder span {
      font-size: 11px; letter-spacing: 3px;
      color: var(--star); font-weight: 400;
      transition: opacity .4s;
    }

    #frame img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
    }

    /* ════════════════════════════════
       TYPING TEXT (obj 2)
    ════════════════════════════════ */
    #typeblock {
      position: fixed;
      /* sits to the right of the frame in its final left position */
      top: 50%;
      left: calc(50% - 130px + 260px + 56px); /* frame-left-edge + frame-width + gap */
      transform: translateY(-50%);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }

    #typed-text {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--white);
      line-height: 1.15;
      white-space: nowrap;
    }

    #typed-text .name {
      font-weight: 800;
    }

    #caret {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: var(--yellow);
      margin-left: 4px;
      vertical-align: middle;
      opacity: 0;
      border-radius: 1px;
    }

    /* ════════════════════════════════
       FINAL SCREEN (frame 125+)
    ════════════════════════════════ */
    #final-content {
      position: fixed;
      inset: 0;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 80px 40px 40px;
    }

    .nav-links {
      display: flex;
      gap: 48px;
      align-items: center;
    }

    .nav-link {
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: none;
      position: relative;
      padding-bottom: 6px;
      transition: color .3s;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 2px;
      background: var(--yellow);
      transition: width .4s ease;
    }

    .nav-link:hover { color: var(--yellow); }
    .nav-link:hover::after { width: 100%; }

    .socials {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--frame-border);
      color: var(--star);
      text-decoration: none;
      transition: border-color .3s, color .3s, box-shadow .3s, transform .3s;
    }

    .social-icon svg {
      width: 20px; height: 20px;
      fill: currentColor;
    }

    .social-icon:hover {
      border-color: var(--yellow);
      color: var(--yellow);
      box-shadow: 0 0 14px 2px rgba(245,200,66,0.3);
      transform: translateY(-3px);
    }

    /* icon-frame in top-left: driven by JS */
    #frame.icon-mode {
      border-color: rgba(168,192,232,0.3);
    }
  </style>
</head>
<body>

<!-- Photo frame -->

<script>
/* ─────────────────────────────────────────────
   FRAME DURATION TIMELINE
   We treat "frames" as ~40ms each → 24fps-ish
   Total sequence ≈ 125 frames × 40ms = 5 seconds
────────────────────────────────────────────── */
const MS = 40; // ms per frame

const frame            = document.getElementById('frame');
const typeblock        = document.getElementById('typeblock');
const caret            = document.getElementById('caret');
const output           = document.getElementById('output');
const finalEl          = document.getElementById('final-content');
const placeholderLabel = document.getElementById('placeholderLabel');

const FULL   = 260; // px
const ICON   = 46;  // px
const GAP    = 56;  // gap between frame and text

/* Viewport-relative positions */
function vw() { return window.innerWidth; }
function vh() { return window.innerHeight; }

/* Left position for frame in its "ORIG" state (left side of center pair) */
function origFrameLeft() {
  return vw() / 2 - FULL / 2 - GAP / 2 - FULL / 2;
  // center of screen minus half the pair width
  // pair width = FULL + GAP + textWidth  ≈ FULL + GAP + FULL*1.5
  // approximate: just shift 180px left of center
}

/* ── Ease helpers ── */
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

/* ── Apply frame state directly (no CSS transition; we drive every frame) ── */
function applyFrame(left, top, size) {
  frame.style.transition = 'none';
  frame.style.transform  = 'none';
  frame.style.left   = left + 'px';
  frame.style.top    = top  + 'px';
  frame.style.width  = size + 'px';
  frame.style.height = size + 'px';
  frame.style.marginLeft = '0';
  frame.style.marginTop  = '0';
}

/* ── Timeline state ── */
let startTime = null;

/* Final icon position: top-left corner with margin */
const ICON_MARGIN = 24;

function getIconPos() {
  return { left: ICON_MARGIN, top: ICON_MARGIN };
}

/* Centered position */
function getCenteredPos(size) {
  return { left: vw()/2 - size/2, top: vh()/2 - size/2 };
}

/* ORIG left position: frame to the left of center-pair */
function getOrigPos() {
  // Center the pair: total width = FULL + GAP + ~260px text ≈ 576px
  const pairW = FULL + GAP + 260;
  const pairLeft = vw()/2 - pairW/2;
  return { left: pairLeft, top: vh()/2 - FULL/2 };
}

/* Where typeblock text starts (right of frame in ORIG) */
function getTypeblockLeft() {
  const orig = getOrigPos();
  return orig.left + FULL + GAP;
}

function tick(now) {
  if (!startTime) startTime = now;
  const elapsed = now - startTime;
  const f = elapsed / MS; // current "frame" number (fractional)

  /* ── Phase 1: 0–25 frames — frame centered ── */
  if (f <= 25) {
    const c = getCenteredPos(FULL);
    applyFrame(c.left, c.top, FULL);
    requestAnimationFrame(tick);
    return;
  }

  /* ── Phase 2: 25–35 frames — frame slides to ORIG ── */
  if (f <= 35) {
    const t   = easeInOut((f - 25) / 10);
    const src = getCenteredPos(FULL);
    const dst = getOrigPos();
    applyFrame(
      lerp(src.left, dst.left, t),
      lerp(src.top,  dst.top,  t),
      FULL
    );
    requestAnimationFrame(tick);
    return;
  }

  /* Ensure frame is locked in ORIG for phases 3, 4 & 5 */
  if (f <= 133) {
    const dst = getOrigPos();
    applyFrame(dst.left, dst.top, FULL);
  }

  /* ── Phase 3: 35–75 — caret appears, typing ── */
  if (f > 35 && f <= 75) {
    typeblock.style.opacity = '1';
    typeblock.style.left = getTypeblockLeft() + 'px';
    caret.style.opacity = '1';

    const fullText = "Hi, I'm Bruno Santana";
    const progress = Math.min((f - 35) / 38, 1);
    const charCount = Math.floor(easeInOut(progress) * fullText.length);
    output.innerHTML = formatText(fullText.slice(0, charCount));

    // Once the full name "Bruno Santana" is typed (last 13 chars), glow yellow
    const nameEl = document.getElementById('nameSpan');
    if (nameEl) {
      // Name fully typed at charCount >= 21 (full string length)
      const nameProgress = Math.max(0, Math.min((charCount - 8) / 13, 1)); // 8 = "Hi, I'm " length
      if (nameProgress >= 1) {
        nameEl.style.color = 'var(--yellow)';
        nameEl.style.textShadow = '0 0 18px rgba(245,200,66,0.7)';
      } else {
        nameEl.style.color = 'var(--white)';
        nameEl.style.textShadow = 'none';
      }
    }

    requestAnimationFrame(tick);
    return;
  }

  /* ── Phase 4: 75–103 — caret lingers; name glow fades to white ── */
  if (f > 75 && f <= 103) {
    output.innerHTML = formatText("Hi, I'm Bruno Santana");
    caret.style.opacity = Math.floor((f - 75) * 5) % 2 === 0 ? '1' : '0.1';

    // Glow fades out over ~12 frames (≈ 0.5s) starting at frame 75
    const glowT = Math.min((f - 75) / 12, 1);
    const nameEl = document.getElementById('nameSpan');
    if (nameEl) {
      // Interpolate from yellow → white
      const r = Math.round(lerp(245, 232, glowT));
      const g = Math.round(lerp(200, 240, glowT));
      const b = Math.round(lerp(66,  255, glowT));
      nameEl.style.color = `rgb(${r},${g},${b})`;
      const glowOpacity = (1 - glowT) * 0.7;
      nameEl.style.textShadow = glowOpacity > 0.01
        ? `0 0 18px rgba(245,200,66,${glowOpacity})`
        : 'none';
    }

    requestAnimationFrame(tick);
    return;
  }

  /* ── Phase 5: 103–133 — deletion ── */
  if (f > 103 && f <= 133) {
    const fullText = "Hi, I'm Bruno Santana";
    const progress = Math.min((f - 103) / 28, 1);
    const remaining = Math.floor((1 - easeInOut(progress)) * fullText.length);
    output.innerHTML = formatText(fullText.slice(0, remaining));
    caret.style.opacity = '1';
    requestAnimationFrame(tick);
    return;
  }

  /* ── Phase 6: 133–143 — frame slides to top-left icon ── */
  if (f > 133 && f <= 143) {
    const t   = easeInOut((f - 133) / 10);
    const src = getOrigPos();
    const dst = getIconPos();

    const size = lerp(FULL, ICON, t);
    applyFrame(
      lerp(src.left, dst.left, t),
      lerp(src.top,  dst.top,  t),
      size
    );

    // fade out typeblock
    typeblock.style.opacity = String(1 - t);
    caret.style.opacity     = '0';

    // hide placeholder label as it shrinks
    if (placeholderLabel) placeholderLabel.style.opacity = String(1 - t * 3);

    requestAnimationFrame(tick);
    return;
  }

  /* ── Phase 7: 143+ — final state ── */
  const ic = getIconPos();
  applyFrame(ic.left, ic.top, ICON);
  typeblock.style.opacity = '0';
  frame.style.border = '1.5px solid rgba(168,192,232,0.3)';
  if (placeholderLabel) placeholderLabel.style.opacity = '0';

  // fade in final content
  finalEl.style.pointerEvents = 'auto';
  const o = Math.min((f - 143) / 20, 1);
  finalEl.style.opacity = String(easeInOut(o));
  if (o < 1) requestAnimationFrame(tick);
}

/* Wrap full name in a span for the glow effect */
function formatText(str) {
  return str.replace(/(Bruno Santana)/, '<span id="nameSpan">$1</span>');
}

/* Start */
requestAnimationFrame(tick);
</script>
</body>
</html>
