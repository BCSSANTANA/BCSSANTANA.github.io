<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bruno</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #040d1e;
      --star:   #a8c0e8;
      --white:  #e8f0ff;
      --yellow: #f5c842;
      --frame-border: rgba(168, 192, 232, 0.45);
      --frame-glow:   rgba(100, 160, 255, 0.18);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      cursor: default;
    }

    /* ── Starfield ── */
    canvas#stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Scene ── */
    .scene {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
    }

    /* ── Photo frame (circle) ── */
    .photo-frame {
      flex-shrink: 0;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 2px solid var(--frame-border);
      box-shadow:
        0 0 0 8px rgba(168,192,232,0.07),
        0 0 50px 10px var(--frame-glow);
      overflow: hidden;
      background: rgba(168,192,232,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: framePulse 6s ease-in-out infinite;
    }

    .photo-frame .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0.35;
      user-select: none;
    }

    .photo-frame .placeholder svg {
      width: 64px;
      height: 64px;
      stroke: var(--star);
      fill: none;
      stroke-width: 1.2;
    }

    .photo-frame .placeholder span {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--star);
      font-weight: 400;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes framePulse {
      0%,100% { box-shadow: 0 0 0 8px rgba(168,192,232,0.07), 0 0 50px 10px rgba(100,160,255,0.18); }
      50%      { box-shadow: 0 0 0 12px rgba(168,192,232,0.11), 0 0 70px 18px rgba(100,160,255,0.28); }
    }

    /* ── Text block ── */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .greeting {
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--white);
      line-height: 1.15;
      white-space: nowrap;
    }

    #brunoSpan {
      font-weight: 800;
      color: var(--white);
      transition: color 0.3s ease;
      display: inline-block;
      cursor: default;
    }

    #brunoSpan:hover {
      color: var(--yellow);
    }

    .period {
      color: var(--yellow);
      font-weight: 800;
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="scene">

  <!-- Obj 2: circular photo frame -->
  <div class="photo-frame">
    <!-- To add your headshot, replace the placeholder div below with:
         <img src="your-photo.jpg" alt="Bruno"> -->
    <div class="placeholder">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="24" r="10"/>
        <path d="M10 54 Q10 38 32 38 Q54 38 54 54"/>
      </svg>
      <span>HEADSHOT</span>
    </div>
  </div>

  <!-- Obj 1: greeting text, to the right of the frame -->
  <div class="text-block">
    <p class="greeting">
      HI I'M <span id="brunoSpan">BRUNO</span><span class="period">.</span>
    </p>
  </div>

</div>

<script>
(function(){
  const canvas = document.getElementById('stars');
  const ctx    = canvas.getContext('2d');
  let W, H, stars = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function seed(){
    stars = [];
    for(let i = 0; i < 280; i++){
      stars.push({
        x:     Math.random() * W,
        y:     Math.random() * H,
        r:     Math.random() * 1.3 + 0.15,
        a:     Math.random() * Math.PI * 2,
        speed: Math.random() * 0.005 + 0.001
      });
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.a += s.speed;
      const alpha = 0.25 + 0.75 * Math.abs(Math.sin(s.a));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(168,192,232,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); seed(); });
  resize(); seed(); draw();
})();
</script>
</body>
</html>
