<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruno Santana</title>
  <style>
    /* CSS reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #040d1e;
      color: #e8f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Top Left Header */
    #top-left-name {
      position: absolute;
      top: 30px;
      left: 40px;
      font-size: 24px;
      letter-spacing: 1px;
      z-index: 10;
    }

    /* Top Navigation Layout */
    #top-nav {
      display: flex;
      justify-content: center;
      gap: 5vw;
      width: 100%;
      padding-top: 60px; /* Adjust this to move texts higher or lower */
    }

    .nav-link {
      font-size: 24px; /* Uniform font size */
      color: #e8f0ff;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.3s;
      display: flex;
    }

    .nav-link:hover {
      color: #f5c842;
    }

    /* Typewriter specific styles */
    .text-content {
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Top Left Name -->
  <div id="top-left-name">
    <span class="text-content"></span>
  </div>

  <!-- Top Links -->
  <div id="top-nav">
    <a href="reading.html" id="link-left" class="nav-link">
      <span class="text-content"></span>
    </a>
    <a href="projects.html" id="link-right" class="nav-link">
      <span class="text-content"></span>
    </a>
  </div>

  <script>
    const sequence = [
      { id: 'top-left-name', text: 'Bruno' },
      { id: 'link-left', text: 'Reading List' },
      { id: 'link-right', text: 'Projects' }
    ];

    const TYPING_SPEED = 75; 
    const PAUSE_BETWEEN = 300; 

    function typeText(elementId, textToType) {
      return new Promise(resolve => {
        const container = document.getElementById(elementId);
        const textSpan = container.querySelector('.text-content');
        
        let i = 0;
        
        function typeChar() {
          if (i < textToType.length) {
            textSpan.textContent += textToType.charAt(i);
            i++;
            setTimeout(typeChar, TYPING_SPEED + (Math.random() * 30));
          } else {
            resolve();
          }
        }
        
        typeChar();
      });
    }

    async function runOpeningSequence() {
      for (let i = 0; i < sequence.length; i++) {
        await typeText(sequence[i].id, sequence[i].text);
        
        if (i < sequence.length - 1) {
          await new Promise(r => setTimeout(r, PAUSE_BETWEEN));
        }
      }
    }

    window.onload = runOpeningSequence;
  </script>
</body>
</html>
