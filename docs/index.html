<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruno Santana</title>
  <style>
    /* CSS reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #040d1e;
      color: #e8f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Top Left Header */
    #top-left-name {
      position: absolute;
      top: 30px;
      left: 40px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 10;
    }

    /* Centered Navigation */
    #center-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5vw;
      width: 100%;
      height: 100%;
      padding: 0 40px;
    }

    .nav-link {
      font-size: clamp(16px, 2vw, 24px);
      color: #e8f0ff;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.3s;
      display: flex;
      align-items: center;
    }

    .nav-link:hover {
      color: #f5c842;
    }

    /* Typewriter specific styles */
    .text-content {
      white-space: nowrap;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background-color: #f5c842;
      vertical-align: bottom;
      margin-left: 4px;
      opacity: 0;
    }

    .cursor.active {
      opacity: 1;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Top Left Name -->
  <div id="top-left-name">
    <span class="text-content"></span><span class="cursor"></span>
  </div>

  <!-- Center Links -->
  <div id="center-nav">
    <a href="reading.html" id="link-left" class="nav-link">
      <span class="text-content"></span><span class="cursor"></span>
    </a>
    <a href="about.html" id="link-center" class="nav-link">
      <span class="text-content"></span><span class="cursor"></span>
    </a>
    <a href="projects.html" id="link-right" class="nav-link">
      <span class="text-content"></span><span class="cursor"></span>
    </a>
  </div>

  <script>
    const sequence = [
      { id: 'top-left-name', text: 'BRUNO' },
      { id: 'link-left', text: 'Reading List' },
      { id: 'link-center', text: 'About Me' },
      { id: 'link-right', text: 'Projects' }
    ];

    const TYPING_SPEED = 75; 
    const PAUSE_BETWEEN = 300; 

    function typeText(elementId, textToType) {
      return new Promise(resolve => {
        const container = document.getElementById(elementId);
        const textSpan = container.querySelector('.text-content');
        const cursor = container.querySelector('.cursor');
        
        cursor.classList.add('active');
        let i = 0;
        
        function typeChar() {
          if (i < textToType.length) {
            textSpan.textContent += textToType.charAt(i);
            i++;
            setTimeout(typeChar, TYPING_SPEED + (Math.random() * 30));
          } else {
            cursor.classList.remove('active');
            resolve();
          }
        }
        
        typeChar();
      });
    }

    async function runOpeningSequence() {
      for (let i = 0; i < sequence.length; i++) {
        await typeText(sequence[i].id, sequence[i].text);
        
        if (i < sequence.length - 1) {
          await new Promise(r => setTimeout(r, PAUSE_BETWEEN));
        } else {
          const lastContainer = document.getElementById(sequence[i].id);
          lastContainer.querySelector('.cursor').classList.add('active');
        }
      }
    }

    window.onload = runOpeningSequence;
  </script>
</body>
</html>
